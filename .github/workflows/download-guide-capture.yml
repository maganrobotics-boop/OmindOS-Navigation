name: Capture published Ubuntu workbench for download guide
on:
  push:
    branches: [codex/download-guide-20261009]
    paths: [.github/workflows/download-guide-capture.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and Chinese fonts
        run: |
          npm install playwright@1.58.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Download and verify public workbench
        run: |
          curl --fail --location --retry 2 --output workbench.tar.gz 'https://github.com/maganrobotics-boop/OmindOS-Navigation-Release/releases/download/v0.2.0-preview.6/omindos-quadruped-workbench-0.2.0-size-candidate.1-linux-x64.tar.gz'
          echo '134fc899a9c2f320527578d8eb80e88ffabb4d44e4e87942828edc0351b79bfe  workbench.tar.gz' | sha256sum -c -
          tar -xzf workbench.tar.gz
          cd omindos-quadruped-workbench-0.2.0-size-candidate.1-linux-x64
          ./OmindOS-Workbench --verify
          ./OmindOS-Workbench --no-browser > ../workbench.log 2>&1 &
      - name: Capture actual interface
        run: timeout 90s node capture-workbench.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: published-workbench-screenshots
          path: capture-output/
